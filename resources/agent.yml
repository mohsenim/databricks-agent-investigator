resources:
  jobs:
    incident_investigator:
      name: incident-investigator
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${resources.apps.incident_app.service_principal_client_id}
      max_concurrent_runs: 5
      queue:
        enabled: true
      timeout_seconds: 900
      parameters:
        - { name: job_id, default: "" }
        - { name: run_id, default: "" }
        - { name: task_key, default: "" }
        - { name: task_run_id, default: "" }
        - { name: trigger_source, default: push }
        - { name: job_name, default: "" }
      environments:
        - environment_key: agent
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
              - langgraph==1.2.17
              - openai
      tasks:
        - task_key: investigate
          environment_key: agent
          max_retries: 0
          python_wheel_task:
            package_name: incident_agent
            entry_point: incident-investigate
            parameters:
              - --job_id
              - "{{job.parameters.job_id}}"
              - --run_id
              - "{{job.parameters.run_id}}"
              - --task_key
              - "{{job.parameters.task_key}}"
              - --task_run_id
              - "{{job.parameters.task_run_id}}"
              - --trigger_source
              - "{{job.parameters.trigger_source}}"
              - --job_name
              - "{{job.parameters.job_name}}"
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse_id
              - ${var.warehouse_id}
              - --model_endpoint
              - ${var.model_endpoint}

    incident_poller:
      name: incident-poller
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: ${var.poll_interval_cron}
        timezone_id: UTC
        pause_status: ${var.poller_pause_status}
      permissions:
        - level: CAN_MANAGE
          service_principal_name: ${resources.apps.incident_app.service_principal_client_id}
      environments:
        - environment_key: agent
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: poll
          environment_key: agent
          max_retries: 0
          python_wheel_task:
            package_name: incident_agent
            entry_point: incident-poll
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --warehouse_id
              - ${var.warehouse_id}
              - --investigator_job_id
              - ${resources.jobs.incident_investigator.id}

  apps:
    incident_app:
      name: ${var.app_name}
      description: Incidents, dashboard and pull controls for the Incident Investigation Agent
      source_code_path: ../app
      config:
        command: ["streamlit", "run", "app.py"]
        env:
          - { name: AGENT_CATALOG, value: "${var.catalog}" }
          - { name: AGENT_SCHEMA, value: "${var.schema}" }
          - { name: AGENT_INVESTIGATOR_JOB_ID, value: "${resources.jobs.incident_investigator.id}" }
          - { name: AGENT_POLLER_JOB_ID, value: "${resources.jobs.incident_poller.id}" }
          - { name: AGENT_WAREHOUSE_ID, value: "${var.warehouse_id}" }
          - { name: AGENT_MODEL_ENDPOINT, value: "${var.model_endpoint}" }
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
